apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: manager
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: controller:latest
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
            # clusterctl treats an empty default as a required variable, so the
            # default selector matches every Cluster except those labeled
            # csr-approver.vexxhost.com/disabled=true.
            - "--cluster-selector=${CSR_APPROVER_CLUSTER_SELECTOR:=csr-approver.vexxhost.com/disabled!=true}"
            - "--deny-invalid=${CSR_APPROVER_DENY_INVALID:=false}"
            - "--max-expiration=${CSR_APPROVER_MAX_EXPIRATION:=0s}"
            - "--diagnostics-address=${CSR_APPROVER_DIAGNOSTICS_ADDRESS:=:8443}"
            - "--insecure-diagnostics=${CSR_APPROVER_INSECURE_DIAGNOSTICS:=false}"
            - "--v=${CSR_APPROVER_LOG_LEVEL:=2}"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - containerPort: 9440
              name: healthz
              protocol: TCP
            - containerPort: 8443
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
